name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'vadirn/muxmuxmux'
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Both React bindings accept ^18.0.0 || ^19.0.0, and the lockfile pins React 19
  react-18:
    if: github.repository == 'vadirn/muxmuxmux'
    name: Test on React 18
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Rewrites both manifests and the lockfile on the runner only; nothing commits them
      - name: Swap in React 18.3.1
        run: >-
          pnpm --filter @muxmuxmux/react --filter @muxmuxmux/machine
          add --save-dev react@18.3.1 react-dom@18.3.1 @types/react@18 @types/react-dom@18

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test run

      - name: Type check
        run: pnpm typecheck
